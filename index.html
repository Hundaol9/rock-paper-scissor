<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
   
</head>

<body>



<div class="game-frame">


   

<header>
    
     <h1>Rock Paper Scissor</h1>
<p>choose your move and beat the computer</p>
 
</header>


<main class="game-content"> 

<section class="game-mode">
    <h2>choose the game mode</h2>

    <button id="five-rounds">5 Rounds</button>
      <button id="seven-rounds">7 Rounds</button>
</section>





<section class="game-area">
<div class="hand-display">
   
    <div class="hand-images">
        <img id="rock-hand" src="images/rockh.png" alt="Rockh">
        <img id="paper-hand" src="images/paperh.png" alt="paperh">
        <img id="scissor-hand" src="images/scissorh.png" alt="scissorh">
    </div>
    <span>VS</span>
 
    <div class="computer-images">
             <img id="rock-computer" src="images/rockc.png" alt="Rockc">
             <img id="paper-computer" src="images/paperc.png" alt="paperc">
             <img id="scissor-computer" src="images/scissorc.png" alt="scissorc">
    </div>
</div>

</section>
    
   

    <div class="choices">
      <h2>choose your move</h2>
        <button class="choice" id="rock">
            <span>Rock</span>
        </button>
    
        <button class="choice" id="paper">
            <span>Paper</span>
        </button>
    
        <button class="choice" id="scissor">
            <span>Scissor</span>
        </button>
    </div>


<section class="scoreboard">
    <div class="score">
        <h2>You</h2>
        <p id="player-score">0</p>
    </div>
    <div class="round">
         <p>Round</p>
         <p id="present-round">0 / 5</p> 
    </div>

     <div class="score">
        <h2>computer</h2>
        <p id="computer-score">0</p>
    </div>
</section>

<section class="result">
    <h2 id="game-result">Choose your move!</h2>
</section>

<section class="restart-section">
     <button class="last" id="restart">
            <span>Restart Game</span>
        </button>
</section>


</main>
</div>
<script src="script.js"></script>
</body>
</html>
